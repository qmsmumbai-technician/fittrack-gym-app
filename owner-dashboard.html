<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTrack Owner — Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7fa; font-family: 'Barlow', system-ui, sans-serif; color: #142850; }
  header { background: #142850; padding: 20px 24px 22px; display: flex; align-items: center; justify-content: space-between; }
  header .title { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 20px; color: #fff; }
  header .sub { font-size: 12px; color: #9db0cf; }
  #logoutBtn { background: rgba(255,255,255,.1); color: #fff; border: none; border-radius: 8px;
    padding: 8px 14px; font-family: 'Barlow'; font-size: 12.5px; cursor: pointer; }
  main { padding: 20px 24px 40px; max-width: 480px; margin: 0 auto; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; }
  .card .label { font-size: 12px; color: #6b7688; }
  .card .value { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 28px; margin-top: 4px; }
  .section-title { font-family: 'Barlow Condensed'; font-weight: 600; font-size: 16px; color: #6b7688;
    margin: 22px 0 10px; }
  .client-row { background: #fff; border-radius: 14px; padding: 12px 14px; display: flex;
    align-items: center; gap: 12px; margin-bottom: 10px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: #dbe4ff; display: flex;
    align-items: center; justify-content: center; font-family: 'Barlow Condensed'; font-weight: 700;
    font-size: 14px; flex-shrink: 0; }
  .client-name { font-weight: 500; font-size: 14.5px; }
  .client-meta { font-size: 11.5px; color: #6b7688; margin-top: 1px; }
  .badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap; margin-left: auto; }
  .badge.active { color: #2e9c5a; background: #e5f3ec; }
  .badge.expiring { color: #c9862c; background: #fdf1de; }
  .badge.expired { color: #c1443c; background: #fbe4e2; }
  .empty, .loading { text-align: center; color: #6b7688; font-size: 14px; padding: 30px 0; }

  /* ===== fancy animations ===== */
  @keyframes fadeInUp { from { opacity:0; transform:translateY(14px);} to {opacity:1; transform:translateY(0);} }
  @keyframes popIn { 0% { transform:scale(.92); opacity:0;} 60% { transform:scale(1.03); opacity:1;} 100% { transform:scale(1); opacity:1;} }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulseGlow { 0%,100% { box-shadow:0 0 0 0 rgba(245,135,31,.5);} 50% { box-shadow:0 0 0 12px rgba(245,135,31,0);} }
  @keyframes logoPulse { 0%,100% { transform:scale(1);} 50% { transform:scale(1.06);} }
  body { animation: fadeInUp .4s ease; animation-fill-mode: none; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button, a.primary, button.primary, .role-btn, a.whatsapp, button.whatsapp, .pill, .option-card, .plan-card, .day-row, .toggle, .trainer-card {
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:active, a.primary:active, button.primary:active, .role-btn:active, a.whatsapp:active, button.whatsapp:active {
    transform: scale(.96);
  }
  .pill:active, .option-card:active, .plan-card:active, .trainer-card:active {
    transform: scale(.97);
  }
  .option-card.selected, .plan-card.selected, .pill.selected, .trainer-card.selected {
    animation: popIn .28s ease;
  }
  .anim-row { opacity: 0; animation: fadeInUp .4s ease forwards; }
  .spinner {
    width: 34px; height: 34px; border: 3px solid #e2e6ee; border-top-color: #f5871f;
    border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px;
  }
  .logo, .avatar:first-child { animation: popIn .5s ease; }

</style>
</head>
<body>

  <header>
    <div>
      <div class="title">FitTrack Gym</div>
      <div class="sub" id="ownerName">Loading...</div>
    </div>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <div style="margin-bottom: 16px; display: flex; gap: 16px; flex-wrap: wrap;">
      <a href="owner-add-client.html" style="font-size: 13px; color: #f5871f; font-weight: 600; text-decoration: none;">+ Add Client</a>
      <a href="owner-trainers.html" style="font-size: 13px; color: #f5871f; font-weight: 600; text-decoration: none;">→ Manage Trainers</a>
      <a href="owner-equipment-list.html" style="font-size: 13px; color: #f5871f; font-weight: 600; text-decoration: none;">→ Equipment</a>
    </div>
    <div class="stats">
      <div class="card"><div class="label">Total Clients</div><div class="value" id="statTotal">–</div></div>
      <div class="card"><div class="label">Active</div><div class="value" id="statActive">–</div></div>
      <div class="card"><div class="label">Expiring Soon</div><div class="value" id="statExpiring">–</div></div>
      <div class="card"><div class="label">Expired</div><div class="value" id="statExpired">–</div></div>
    </div>

    <div class="section-title">ALL CLIENTS</div>
    <div id="clientList" class="loading"><div class="spinner"></div>Loading clients...</div>
  </main>

  <script type="module">
    import { auth } from "./js/firebase-config.js?v=2";
    import { watchAuthState, logout } from "./js/auth-service.js?v=2";
    import { getAllClients, getClientStatus } from "./js/client-service.js?v=2";

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await logout();
      window.location.href = "owner-login.html";
    });

    function initials(name) {
      return name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
    }

    function renderClients(clients) {
      const listEl = document.getElementById("clientList");

      if (clients.length === 0) {
        listEl.className = "empty";
        listEl.textContent = "No clients yet — add your first client to see them here.";
        document.getElementById("statTotal").textContent = "0";
        document.getElementById("statActive").textContent = "0";
        document.getElementById("statExpiring").textContent = "0";
        document.getElementById("statExpired").textContent = "0";
        return;
      }

      let active = 0, expiring = 0, expired = 0;
      listEl.className = "";
      listEl.innerHTML = "";

      clients.forEach((client, i) => {
        const { status, daysLeft } = getClientStatus(client);
        if (status === "active") active++;
        else if (status === "expiring") expiring++;
        else expired++;

        const badgeText = status === "expired" ? "Expired"
          : status === "expiring" ? `${daysLeft}d left`
          : "Active";

        const row = document.createElement("a");
        row.href = `owner-client-detail.html?clientId=${client.id}`;
        row.style.textDecoration = "none";
        row.style.color = "inherit";
        row.className = "client-row anim-row";
        row.style.display = "flex";
        row.style.cursor = "pointer";
        row.style.animationDelay = `${i * 60}ms`;
        row.innerHTML = `
          <div class="avatar">${initials(client.name)}</div>
          <div>
            <div class="client-name">${client.name}</div>
            <div class="client-meta">${client.planName || ""} · ${client.purpose ? client.purpose.replace("_", " ") : ""}</div>
          </div>
          <div class="badge ${status}">${badgeText}</div>
        `;
        listEl.appendChild(row);
      });

      document.getElementById("statTotal").textContent = clients.length;
      document.getElementById("statActive").textContent = active;
      document.getElementById("statExpiring").textContent = expiring;
      document.getElementById("statExpired").textContent = expired;
    }

    watchAuthState(async (session) => {
      if (!session) {
        window.location.href = "owner-login.html";
        return;
      }
      if (session.role !== "owner") {
        document.body.innerHTML = "<p style='padding:40px;text-align:center;'>This account isn't registered as an Owner.</p>";
        return;
      }

      document.getElementById("ownerName").textContent = `Welcome, ${session.profile.name || "Owner"}`;

      try {
        const clients = await getAllClients();
        renderClients(clients);
      } catch (err) {
        document.getElementById("clientList").textContent = "Couldn't load clients: " + err.message;
      }
    });
  </script>

</body>
</html>
