<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTrack Owner — Edit Client</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7fa; font-family: 'Barlow', system-ui, sans-serif; color: #142850; }
  header { padding: 18px 24px; display: flex; align-items: center; gap: 14px; }
  header a { color: #142850; text-decoration: none; display: flex; }
  .title { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 20px; }
  main { padding: 8px 24px 110px; max-width: 480px; margin: 0 auto; }

  label { font-size: 12.5px; font-weight: 600; color: #6b7688; display: block; margin-top: 16px; }
  input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 13px 14px;
    border-radius: 10px; border: 1.5px solid #dfe4ec; font-size: 15px; outline: none; font-family: 'Barlow'; }

  .option-card { background: #fff; border: 1.5px solid #e2e6ee; border-radius: 12px; padding: 12px 16px;
    display: flex; align-items: center; gap: 14px; margin-top: 10px; cursor: pointer; }
  .option-card.selected { border-color: #f5871f; }
  .option-icon { width: 44px; height: 44px; border-radius: 10px; background: #eef1f6; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .option-icon img { width: 100%; height: 100%; object-fit: contain; }
  .option-card.selected .option-icon { background: #fdeee0; }
  .option-label { flex: 1; font-size: 14px; font-weight: 500; }
  .radio-dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #c7cede; flex-shrink: 0; }
  .option-card.selected .radio-dot { border: none; background: #f5871f; }

  .pill-row { display: flex; gap: 8px; margin-top: 8px; }
  .pill { flex: 1; text-align: center; background: #fff; border: 1.5px solid #dfe4ec; border-radius: 10px;
    padding: 10px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .pill.selected { background: #142850; color: #fff; border-color: #142850; }

  .trainer-card { background: #fff; border: 1.5px solid #e2e6ee; border-radius: 10px; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px; margin-top: 8px; cursor: pointer; }
  .trainer-card.selected { border-color: #f5871f; }
  .t-avatar { width: 30px; height: 30px; border-radius: 50%; background: #dbe4ff; display: flex;
    align-items: center; justify-content: center; font-family: 'Barlow Condensed'; font-weight: 700; font-size: 11px; }

  .bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; padding: 16px 24px 12px;
    border-top: 1px solid #eef1f6; max-width: 480px; margin: 0 auto; }
  button.primary { width: 100%; background: #142850; color: #fff; border: none; border-radius: 12px;
    padding: 15px; font-family: 'Barlow'; font-weight: 600; font-size: 15.5px; cursor: pointer; }
  button.primary:disabled { opacity: .6; }
  .error { color: #c1443c; font-size: 12.5px; margin-top: 10px; display: none; text-align: center; }
  .loading { text-align: center; color: #6b7688; padding: 40px 0; }
  .note { font-size: 12px; color: #a9b3c2; margin-top: 4px; }

  /* ===== fancy animations ===== */
  @keyframes fadeInUp { from { opacity:0; transform:translateY(14px);} to {opacity:1; transform:translateY(0);} }
  @keyframes popIn { 0% { transform:scale(.92); opacity:0;} 60% { transform:scale(1.03); opacity:1;} 100% { transform:scale(1); opacity:1;} }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulseGlow { 0%,100% { box-shadow:0 0 0 0 rgba(245,135,31,.5);} 50% { box-shadow:0 0 0 12px rgba(245,135,31,0);} }
  @keyframes logoPulse { 0%,100% { transform:scale(1);} 50% { transform:scale(1.06);} }
  body { animation: fadeInUp .4s ease;
  animation-fill-mode: none; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button, a.primary, button.primary, .role-btn, a.whatsapp, button.whatsapp, .pill, .option-card, .plan-card, .day-row, .toggle, .trainer-card {
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:active, a.primary:active, button.primary:active, .role-btn:active, a.whatsapp:active, button.whatsapp:active {
    transform: scale(.96);
  }
  .pill:active, .option-card:active, .plan-card:active, .trainer-card:active {
    transform: scale(.97);
  }
  .option-card.selected, .plan-card.selected, .pill.selected, .trainer-card.selected {
    animation: popIn .28s ease;
  }
  .anim-row { opacity: 0; animation: fadeInUp .4s ease forwards; }
  .spinner {
    width: 34px; height: 34px; border: 3px solid #e2e6ee; border-top-color: #f5871f;
    border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px;
  }
  .logo, .avatar:first-child { animation: popIn .5s ease; }

</style>
</head>
<body>

  <header>
    <a id="backLink" href="owner-dashboard.html" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="title">Edit Client</div>
  </header>

  <main id="mainContent">
    <div class="loading">Loading client...</div>
  </main>

  <script type="module">
    import { watchAuthState } from "./js/auth-service.js?v=2";
    import { getClient, getAllTrainers, updateClient } from "./js/client-service.js?v=2";

    const params = new URLSearchParams(window.location.search);
    const clientId = params.get("clientId");
    document.getElementById("backLink").href = `owner-client-detail.html?clientId=${clientId}`;

    const PURPOSES = [
      { id: "weight_loss", label: "Weight Loss", img: "icons/goal-weight-loss.png" },
      { id: "muscle_gain", label: "Muscle Gain", img: "icons/goal-muscle-gain.png" },
      { id: "general_fitness", label: "General Fitness" },
      { id: "strength_training", label: "Strength Training" },
      { id: "rehab", label: "Rehab / Recovery" }
    ];

    let state = { purpose: null, sessionTimePref: "morning", trainerId: null };

    if (!clientId) {
      document.getElementById("mainContent").innerHTML = "<p style='padding:40px;text-align:center;'>No client selected.</p>";
    }

    async function loadAndRender() {
      try {
        const client = await getClient(clientId);
        if (!client) {
          document.getElementById("mainContent").innerHTML = "<p style='padding:40px;text-align:center;'>Client not found.</p>";
          return;
        }
        state.purpose = client.purpose || null;
        state.sessionTimePref = client.sessionTimePref || "morning";
        state.trainerId = client.assignedTrainerId || null;

        const trainers = await getAllTrainers();

        document.getElementById("mainContent").innerHTML = `
          <div class="note">Plan, pricing and expiry aren't editable here — use Renew for that. This is for correcting details.</div>

          <label>CLIENT NAME</label>
          <input id="cName" value="${client.name || ''}">

          <label>MOBILE NUMBER</label>
          <input id="cPhone" value="${client.phone || ''}">

          <label style="margin-top:20px;">GOAL</label>
          <div id="purposeOptions"></div>

          <label>SESSION TIME</label>
          <div class="pill-row" id="sessionRow">
            <div class="pill" data-val="morning">Morning</div>
            <div class="pill" data-val="evening">Evening</div>
          </div>

          <label>ASSIGNED TRAINER</label>
          <div id="trainerOptions"></div>

          <div class="error" id="formError"></div>
        `;

        // purpose cards
        const pEl = document.getElementById("purposeOptions");
        function renderPurposes() {
          pEl.innerHTML = "";
          PURPOSES.forEach(p => {
            const card = document.createElement("div");
            card.className = "option-card" + (state.purpose === p.id ? " selected" : "");
            card.innerHTML = `
              <div class="option-icon">${p.img ? `<img src="${p.img}" alt="${p.label}" width="44" height="44" style="width:44px;height:44px;object-fit:contain;display:block;">` : ''}</div>
              <div class="option-label">${p.label}</div>
              <div class="radio-dot"></div>
            `;
            card.addEventListener("click", () => { state.purpose = p.id; renderPurposes(); });
            pEl.appendChild(card);
          });
        }
        renderPurposes();

        // session pill
        document.querySelectorAll("#sessionRow .pill").forEach(p => {
          if (p.dataset.val === state.sessionTimePref) p.classList.add("selected");
          p.addEventListener("click", () => {
            document.querySelectorAll("#sessionRow .pill").forEach(x => x.classList.remove("selected"));
            p.classList.add("selected");
            state.sessionTimePref = p.dataset.val;
          });
        });

        // trainer list
        const tEl = document.getElementById("trainerOptions");
        const activeTrainers = trainers.filter(t => t.active || t.id === state.trainerId);
        if (activeTrainers.length === 0) {
          tEl.innerHTML = '<div class="note">No trainers available.</div>';
        } else {
          activeTrainers.forEach(t => {
            const card = document.createElement("div");
            card.className = "trainer-card" + (state.trainerId === t.id ? " selected" : "");
            const initials = (t.name || "??").split(" ").map(w => w[0]).slice(0,2).join("").toUpperCase();
            card.innerHTML = `
              <div class="t-avatar">${initials}</div>
              <div style="flex:1;font-size:14px;">${t.name}</div>
            `;
            card.addEventListener("click", () => {
              state.trainerId = t.id;
              document.querySelectorAll(".trainer-card").forEach(c => c.classList.remove("selected"));
              card.classList.add("selected");
            });
            tEl.appendChild(card);
          });
        }

        document.getElementById("bottomBar").style.display = "block";
      } catch (err) {
        document.getElementById("mainContent").innerHTML = `<p style='padding:40px;text-align:center;color:#c1443c;'>Error: ${err.message}</p>`;
      }
    }

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const errorEl = document.getElementById("formError");
      const saveBtn = document.getElementById("saveBtn");
      if (errorEl) errorEl.style.display = "none";

      const name = document.getElementById("cName").value.trim();
      const phone = document.getElementById("cPhone").value.trim();

      if (!name || !phone) {
        alert("Name and phone are required.");
        return;
      }
      if (!state.purpose) {
        alert("Please select a goal.");
        return;
      }
      if (!state.trainerId) {
        alert("Please select a trainer.");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      try {
        await updateClient(clientId, {
          name, phone,
          purpose: state.purpose,
          sessionTimePref: state.sessionTimePref,
          assignedTrainerId: state.trainerId
        });
        window.location.href = `owner-client-detail.html?clientId=${clientId}`;
      } catch (err) {
        if (errorEl) {
          errorEl.textContent = "Error saving: " + err.message;
          errorEl.style.display = "block";
        }
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Changes";
      }
    });

    watchAuthState((session) => {
      if (!session) { window.location.href = "owner-login.html"; return; }
      if (session.role !== "owner") {
        document.body.innerHTML = "<p style='padding:40px;text-align:center;'>Owner access only.</p>";
        return;
      }
      if (clientId) loadAndRender();
    });
  </script>

  <div class="bottom-bar" id="bottomBar" style="display:none;">
    <button class="primary" id="saveBtn">Save Changes</button>
  </div>

</body>
</html>
