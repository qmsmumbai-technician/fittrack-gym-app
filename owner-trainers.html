<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTrack Owner — Trainers</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7fa; font-family: 'Barlow', system-ui, sans-serif; color: #142850; }
  header { padding: 18px 24px; display: flex; align-items: center; gap: 14px; }
  header a { color: #142850; text-decoration: none; display: flex; }
  header .title { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 20px; }
  main { padding: 8px 24px 100px; max-width: 480px; margin: 0 auto; }
  .trainer-row { background: #fff; border-radius: 14px; padding: 14px; display: flex;
    align-items: center; gap: 12px; margin-bottom: 10px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: #dbe4ff; display: flex;
    align-items: center; justify-content: center; font-family: 'Barlow Condensed'; font-weight: 700;
    font-size: 15px; flex-shrink: 0; }
  .t-name { font-weight: 500; font-size: 15px; }
  .t-meta { font-size: 12px; color: #6b7688; }
  .toggle { margin-left: auto; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
  .toggle.active { color: #2e9c5a; background: #e5f3ec; }
  .toggle.inactive { color: #6b7688; background: #eef1f6; }
  .empty { text-align: center; color: #6b7688; font-size: 14px; padding: 30px 0; }
  .fab-area { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; padding: 16px 24px 12px;
    border-top: 1px solid #eef1f6; max-width: 480px; margin: 0 auto; }
  button.primary { width: 100%; background: #142850; color: #fff; border: none; border-radius: 12px;
    padding: 15px; font-family: 'Barlow'; font-weight: 600; font-size: 15.5px; cursor: pointer; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
    align-items: flex-end; justify-content: center; z-index: 10; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 20px 20px 0 0; padding: 24px; width: 100%; max-width: 480px; }
  .modal h2 { font-family: 'Barlow Condensed'; font-size: 20px; margin: 0 0 16px; }
  .modal label { font-size: 12.5px; font-weight: 600; color: #6b7688; display: block; margin-top: 12px; }
  .modal input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 12px 14px;
    border-radius: 10px; border: 1.5px solid #dfe4ec; font-size: 14.5px; outline: none; font-family: 'Barlow'; }
  .modal .hint { font-size: 11.5px; color: #6b7688; margin-top: 4px; line-height: 1.4; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button { flex: 1; border-radius: 10px; padding: 13px; font-family: 'Barlow';
    font-weight: 600; font-size: 14px; border: none; cursor: pointer; }
  .btn-cancel { background: #eef1f6; color: #142850; }
  .btn-save { background: #f5871f; color: #fff; }
  .modal .error { color: #c1443c; font-size: 12.5px; margin-top: 10px; display: none; }
</style>
</head>
<body>

  <header>
    <a href="owner-dashboard.html" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="title">Trainers</div>
  </header>

  <main>
    <div id="trainerList" class="empty">Loading trainers...</div>
  </main>

  <div class="fab-area">
    <button class="primary" id="openModalBtn">+ Add New Trainer</button>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Add Trainer</h2>

      <label>NAME</label>
      <input id="tName" placeholder="Trainer's full name">

      <label>PHONE</label>
      <input id="tPhone" placeholder="10-digit mobile number">

      <label>FIREBASE AUTH UID</label>
      <input id="tUid" placeholder="Paste UID from Firebase Console">
      <div class="hint">First create their login: Firebase Console → Authentication → Add user (their email + a password). Then copy the User UID it generates and paste it here.</div>

      <div class="error" id="modalError"></div>

      <div class="modal-actions">
        <button class="btn-cancel" id="cancelBtn">Cancel</button>
        <button class="btn-save" id="saveBtn">Save Trainer</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { watchAuthState } from "./js/auth-service.js";
    import { getAllTrainers, addTrainerRecord } from "./js/client-service.js";

    let currentSession = null;

    function initials(name) {
      return name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
    }

    async function loadTrainers() {
      const listEl = document.getElementById("trainerList");
      try {
        const trainers = await getAllTrainers();
        if (trainers.length === 0) {
          listEl.className = "empty";
          listEl.textContent = "No trainers yet — add your first one below.";
          return;
        }
        listEl.className = "";
        listEl.innerHTML = "";
        trainers.forEach(t => {
          const row = document.createElement("div");
          row.className = "trainer-row";
          row.innerHTML = `
            <div class="avatar">${initials(t.name || "??")}</div>
            <div>
              <div class="t-name">${t.name}</div>
              <div class="t-meta">${t.phone || ""} · ${t.clientCount || 0} clients</div>
            </div>
            <div class="toggle ${t.active ? 'active' : 'inactive'}">${t.active ? 'Active' : 'Inactive'}</div>
          `;
          listEl.appendChild(row);
        });
      } catch (err) {
        listEl.className = "empty";
        listEl.textContent = "Couldn't load trainers: " + err.message;
      }
    }

    watchAuthState((session) => {
      if (!session) { window.location.href = "owner-login.html"; return; }
      if (session.role !== "owner") {
        document.body.innerHTML = "<p style='padding:40px;text-align:center;'>Owner access only.</p>";
        return;
      }
      currentSession = session;
      loadTrainers();
    });

    const overlay = document.getElementById("modalOverlay");
    document.getElementById("openModalBtn").addEventListener("click", () => {
      document.getElementById("modalError").style.display = "none";
      overlay.classList.add("open");
    });
    document.getElementById("cancelBtn").addEventListener("click", () => {
      overlay.classList.remove("open");
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const name = document.getElementById("tName").value.trim();
      const phone = document.getElementById("tPhone").value.trim();
      const uid = document.getElementById("tUid").value.trim();
      const errorEl = document.getElementById("modalError");
      const saveBtn = document.getElementById("saveBtn");

      if (!name || !phone || !uid) {
        errorEl.textContent = "All three fields are required.";
        errorEl.style.display = "block";
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      try {
        await addTrainerRecord(uid, { name, phone });
        overlay.classList.remove("open");
        document.getElementById("tName").value = "";
        document.getElementById("tPhone").value = "";
        document.getElementById("tUid").value = "";
        await loadTrainers();
      } catch (err) {
        errorEl.textContent = "Error: " + err.message;
        errorEl.style.display = "block";
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Trainer";
      }
    });
  </script>

</body>
</html>
