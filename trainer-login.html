<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTrack Trainer — Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0d1b33;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Barlow', system-ui, sans-serif; color: #fff; padding: 0 32px;
  }
  .logo { width: 68px; height: 68px; border-radius: 18px; background: #f5871f;
    display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  h1 { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 24px; margin: 0; }
  .sub { font-size: 12.5px; color: #9db0cf; margin-top: 2px; margin-bottom: 28px; }
  form { width: 100%; max-width: 340px; }
  label { font-size: 12.5px; font-weight: 600; color: #9db0cf; display: block; margin-top: 14px; }
  input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 13px 14px;
    border-radius: 10px; border: none; font-size: 15px; outline: none;
    font-family: 'Barlow'; background: #fff; color: #142850; }
  button { width: 100%; background: #f5871f; color: #fff; border: none; border-radius: 12px;
    padding: 16px; font-family: 'Barlow'; font-weight: 600; font-size: 15.5px; margin-top: 22px;
    cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .error { color: #ff9d94; font-size: 13px; margin-top: 14px; text-align: center; display: none; }
</style>
</head>
<body>

  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
  </div>
  <h1>FitTrack Trainer</h1>
  <div class="sub">View your assigned clients &amp; sessions</div>

  <form id="loginForm">
    <label for="email">EMAIL</label>
    <input id="email" type="email" placeholder="you@email.com" required autocomplete="username">

    <label for="password">PASSWORD</label>
    <input id="password" type="password" placeholder="Enter password" required autocomplete="current-password">

    <button id="loginBtn" type="submit">Login</button>
    <div id="error" class="error"></div>
  </form>

  <script type="module">
    import { login, getCurrentRole } from "./js/auth-service.js";

    const form = document.getElementById("loginForm");
    const btn = document.getElementById("loginBtn");
    const errorEl = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Logging in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const user = await login(email, password);
        const { role } = await getCurrentRole(user.uid);

        if (role === "trainer") {
          window.location.href = "trainer-dashboard.html";
        } else if (role === "owner") {
          errorEl.textContent = "This account is registered as the Owner, not a Trainer.";
          errorEl.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Login";
        } else {
          errorEl.textContent = "This account has no role assigned. Ask the gym owner to add you as a trainer.";
          errorEl.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Login";
        }
      } catch (err) {
        errorEl.textContent = "Error: " + err.code + " — " + err.message;
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });
  </script>

</body>
</html>
