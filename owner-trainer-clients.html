<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTrack Owner — Trainer's Clients</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7fa; font-family: 'Barlow', system-ui, sans-serif; color: #142850; }
  header { padding: 18px 24px 8px; display: flex; align-items: center; gap: 14px; }
  header a { color: #142850; text-decoration: none; display: flex; }
  .title { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 20px; }
  .sub { font-size: 12px; color: #6b7688; padding: 0 24px 16px; }
  main { padding: 0 24px 30px; max-width: 480px; margin: 0 auto; }

  .client-row { background: #fff; border-radius: 14px; padding: 12px 14px; display: flex;
    align-items: center; gap: 12px; margin-bottom: 10px; text-decoration: none; color: inherit; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: #dbe4ff; display: flex;
    align-items: center; justify-content: center; font-family: 'Barlow Condensed'; font-weight: 700;
    font-size: 14px; flex-shrink: 0; }
  .client-name { font-weight: 500; font-size: 14.5px; }
  .client-meta { font-size: 11.5px; color: #6b7688; }
  .badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap; margin-left: auto; }
  .badge.active { color: #2e9c5a; background: #e5f3ec; }
  .badge.expiring { color: #c9862c; background: #fdf1de; }
  .badge.expired { color: #c1443c; background: #fbe4e2; }
  .loading, .empty { text-align: center; color: #6b7688; font-size: 14px; padding: 30px 0; }
  .spinner { width: 34px; height: 34px; border: 3px solid #e2e6ee; border-top-color: #f5871f;
    border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== fancy animations ===== */
  @keyframes fadeInUp { from { opacity:0; transform:translateY(14px);} to {opacity:1; transform:translateY(0);} }
  @keyframes popIn { 0% { transform:scale(.92); opacity:0;} 60% { transform:scale(1.03); opacity:1;} 100% { transform:scale(1); opacity:1;} }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulseGlow { 0%,100% { box-shadow:0 0 0 0 rgba(245,135,31,.5);} 50% { box-shadow:0 0 0 12px rgba(245,135,31,0);} }
  @keyframes logoPulse { 0%,100% { transform:scale(1);} 50% { transform:scale(1.06);} }
  body { animation: fadeInUp .4s ease;
  animation-fill-mode: none; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button, a.primary, button.primary, .role-btn, a.whatsapp, button.whatsapp, .pill, .option-card, .plan-card, .day-row, .toggle, .trainer-card {
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:active, a.primary:active, button.primary:active, .role-btn:active, a.whatsapp:active, button.whatsapp:active {
    transform: scale(.96);
  }
  .pill:active, .option-card:active, .plan-card:active, .trainer-card:active {
    transform: scale(.97);
  }
  .option-card.selected, .plan-card.selected, .pill.selected, .trainer-card.selected {
    animation: popIn .28s ease;
  }
  .anim-row { opacity: 0; animation: fadeInUp .4s ease forwards; }
  .spinner {
    width: 34px; height: 34px; border: 3px solid #e2e6ee; border-top-color: #f5871f;
    border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px;
  }
  .logo, .avatar:first-child { animation: popIn .5s ease; }

</style>
</head>
<body>

  <header>
    <a href="owner-trainers.html" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="title" id="trainerName">Loading...</div>
  </header>
  <div class="sub" id="clientCount"></div>

  <main>
    <div id="clientList" class="loading"><div class="spinner"></div>Loading clients...</div>
  </main>

  <script type="module">
    import { watchAuthState } from "./js/auth-service.js?v=2";
    import { getClientsForTrainer, getClientStatus } from "./js/client-service.js?v=2";

    const params = new URLSearchParams(window.location.search);
    const trainerId = params.get("trainerId");
    const trainerName = params.get("name") || "Trainer";
    document.getElementById("trainerName").textContent = trainerName;

    function initials(name) {
      return name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
    }

    function renderClients(clients) {
      const listEl = document.getElementById("clientList");
      document.getElementById("clientCount").textContent =
        `${clients.length} client${clients.length === 1 ? '' : 's'} assigned`;

      if (clients.length === 0) {
        listEl.className = "empty";
        listEl.textContent = "No clients assigned to this trainer yet.";
        return;
      }

      listEl.className = "";
      listEl.innerHTML = "";
      clients.forEach(client => {
        const { status, daysLeft } = getClientStatus(client);
        const badgeText = status === "expired" ? "Expired"
          : status === "expiring" ? `${daysLeft}d left`
          : "Active";

        const row = document.createElement("a");
        row.href = `owner-client-detail.html?clientId=${client.id}`;
        row.className = "client-row";
        row.innerHTML = `
          <div class="avatar">${initials(client.name)}</div>
          <div>
            <div class="client-name">${client.name}</div>
            <div class="client-meta">${client.planName || ""} · ${client.purpose ? client.purpose.replace("_", " ") : ""}</div>
          </div>
          <div class="badge ${status}">${badgeText}</div>
        `;
        listEl.appendChild(row);
      });
    }

    watchAuthState(async (session) => {
      if (!session) { window.location.href = "owner-login.html"; return; }
      if (session.role !== "owner") {
        document.body.innerHTML = "<p style='padding:40px;text-align:center;'>Owner access only.</p>";
        return;
      }
      if (!trainerId) {
        document.getElementById("clientList").innerHTML = "No trainer selected.";
        return;
      }
      try {
        const clients = await getClientsForTrainer(trainerId);
        renderClients(clients);
      } catch (err) {
        document.getElementById("clientList").textContent = "Error: " + err.message;
      }
    });
  </script>

</body>
</html>
