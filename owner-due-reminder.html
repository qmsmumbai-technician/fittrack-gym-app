<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTrack Owner — Due Amount Reminders</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7fa; font-family: 'Barlow', system-ui, sans-serif; color: #142850; }
  header { padding: 18px 24px; display: flex; align-items: center; gap: 14px; }
  header a { color: #142850; text-decoration: none; display: flex; }
  .title { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 20px; }
  main { padding: 8px 24px 40px; max-width: 480px; margin: 0 auto; }

  .summary { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; display: flex;
    justify-content: space-between; align-items: center; }
  .summary-label { font-size: 12.5px; color: #6b7688; }
  .summary-value { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 22px; color: #c9862c; }

  .due-card { background: #fff; border: 1.5px solid #e2e6ee; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .due-top { display: flex; align-items: center; justify-content: space-between; }
  .due-name { font-weight: 600; font-size: 15px; }
  .due-phone { font-size: 12px; color: #6b7688; margin-top: 1px; }
  .due-amount { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 17px; color: #c1443c; }
  .due-plan { font-size: 11.5px; color: #6b7688; margin-top: 1px; text-align: right; }
  .remind-btn { display: block; text-align: center; margin-top: 10px; background: #e5f3ec; color: #2e9c5a;
    border-radius: 9px; padding: 10px 0; font-size: 13px; font-weight: 600; text-decoration: none; }

  .empty-note { text-align: center; color: #6b7688; font-size: 14px; padding: 40px 0; }

  /* ===== fancy animations ===== */
  @keyframes fadeInUp { from { opacity:0; transform:translateY(14px);} to {opacity:1; transform:translateY(0);} }
  @keyframes spin { to { transform:rotate(360deg); } }
  body { animation: fadeInUp .4s ease; animation-fill-mode: none; }
  a { -webkit-tap-highlight-color: transparent; transition: transform .12s ease; }
  .remind-btn:active { transform: scale(.96); }
  .anim-row { opacity: 0; animation: fadeInUp .4s ease forwards; }
  .spinner { width: 34px; height: 34px; border: 3px solid #e2e6ee; border-top-color: #f5871f;
    border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px; }
</style>
</head>
<body>

  <header>
    <a href="owner-dashboard.html" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="title">Due Amount Reminders</div>
  </header>

  <main>
    <div class="summary">
      <div>
        <div class="summary-label">TOTAL DUE</div>
        <div class="summary-value" id="totalDue">—</div>
      </div>
      <div style="text-align:right;">
        <div class="summary-label">CLIENTS</div>
        <div class="summary-value" id="dueCount" style="color:#142850;">—</div>
      </div>
    </div>

    <div id="dueList"><div class="spinner"></div></div>
  </main>

  <script type="module">
    import { watchAuthState } from "./js/auth-service.js?v=2";
    import { getAllClients, getPayments } from "./js/client-service.js?v=2";

    function money(n) {
      return "₹" + Math.round(n || 0).toLocaleString("en-IN");
    }

    async function load() {
      const listEl = document.getElementById("dueList");
      try {
        const clients = await getAllClients();
        const withDue = [];

        await Promise.all(clients.map(async (client) => {
          const payments = await getPayments(client.id);
          const paid = payments.reduce((sum, p) => sum + (p.amount || 0), 0);
          const due = (client.planPrice || 0) - paid;
          if (due > 0) withDue.push({ ...client, due });
        }));

        withDue.sort((a, b) => b.due - a.due);

        const totalDue = withDue.reduce((sum, c) => sum + c.due, 0);
        document.getElementById("totalDue").textContent = money(totalDue);
        document.getElementById("dueCount").textContent = withDue.length;

        if (withDue.length === 0) {
          listEl.innerHTML = '<div class="empty-note">No pending dues — everyone\'s paid up. 🎉</div>';
          return;
        }

        listEl.innerHTML = "";
        withDue.forEach((c, i) => {
          const phoneDigits = (c.phone || "").replace(/\D/g, "");
          const message = `Hi ${c.name}, this is a friendly reminder from FitTrack Gym that ${money(c.due)} is pending on your ${c.planName || "membership"}. Please clear it at your earliest convenience. Thank you!`;
          const waLink = `https://wa.me/${phoneDigits}?text=${encodeURIComponent(message)}`;

          const card = document.createElement("div");
          card.className = "due-card anim-row";
          card.style.animationDelay = (i * 0.03) + "s";
          card.innerHTML = `
            <div class="due-top">
              <div>
                <div class="due-name">${c.name}</div>
                <div class="due-phone">${c.phone || "no phone on file"}</div>
              </div>
              <div>
                <div class="due-amount">${money(c.due)}</div>
                <div class="due-plan">${c.planName || ""}</div>
              </div>
            </div>
            <a class="remind-btn" href="${waLink}" target="_blank" rel="noopener">Send WhatsApp Reminder</a>
          `;
          listEl.appendChild(card);
        });
      } catch (err) {
        listEl.innerHTML = `<div class="empty-note">Error loading dues: ${err.message}</div>`;
      }
    }

    watchAuthState((session) => {
      if (!session) { window.location.href = "owner-login.html"; return; }
      if (session.role !== "owner") {
        document.body.innerHTML = "<p style='padding:40px;text-align:center;'>Owner access only.</p>";
        return;
      }
      load();
    });
  </script>

</body>
</html>
