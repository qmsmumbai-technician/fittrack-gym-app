<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTrack Owner — Add Expense</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7fa; font-family: 'Barlow', system-ui, sans-serif; color: #142850; }
  header { padding: 18px 24px; display: flex; align-items: center; gap: 14px; }
  header a { color: #142850; text-decoration: none; display: flex; }
  .title { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 20px; }
  main { padding: 8px 24px 110px; max-width: 480px; margin: 0 auto; }

  label { font-size: 12.5px; font-weight: 600; color: #6b7688; display: block; margin-top: 16px; }
  input, textarea { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 13px 14px;
    border-radius: 10px; border: 1.5px solid #dfe4ec; font-size: 15px; outline: none; font-family: 'Barlow'; }
  textarea { height: 60px; resize: none; }
  .row-2 { display: flex; gap: 12px; }
  .row-2 > div { flex: 1; }

  .pill-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .pill { text-align: center; background: #fff; border: 1.5px solid #dfe4ec; border-radius: 10px;
    padding: 9px 14px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .pill.selected { background: #142850; color: #fff; border-color: #142850; }

  .section-title { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 14px;
    color: #6b7688; letter-spacing: .04em; margin: 28px 0 10px; }
  .exp-row { background: #fff; border: 1.5px solid #e2e6ee; border-radius: 12px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .exp-cat { font-weight: 600; font-size: 14px; }
  .exp-note { font-size: 12px; color: #6b7688; margin-top: 2px; }
  .exp-amount { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 16px; color: #c1443c; }
  .exp-date { font-size: 11px; color: #6b7688; text-align: right; margin-top: 2px; }
  .empty-note { font-size: 13px; color: #6b7688; padding: 12px 0; }

  .bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; padding: 16px 24px 12px;
    border-top: 1px solid #eef1f6; max-width: 480px; margin: 0 auto; }
  button.primary { width: 100%; background: #f5871f; color: #fff; border: none; border-radius: 12px;
    padding: 15px; font-family: 'Barlow'; font-weight: 600; font-size: 15.5px; cursor: pointer; }
  button.primary:disabled { opacity: .6; }
  .error { color: #c1443c; font-size: 12.5px; margin-top: 10px; display: none; text-align: center; }

  /* ===== fancy animations ===== */
  @keyframes fadeInUp { from { opacity:0; transform:translateY(14px);} to {opacity:1; transform:translateY(0);} }
  @keyframes popIn { 0% { transform:scale(.92); opacity:0;} 60% { transform:scale(1.03); opacity:1;} 100% { transform:scale(1); opacity:1;} }
  @keyframes spin { to { transform:rotate(360deg); } }
  body { animation: fadeInUp .4s ease; animation-fill-mode: none; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button, a.primary, button.primary, .pill {
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:active, a.primary:active, button.primary:active { transform: scale(.96); }
  .pill:active { transform: scale(.97); }
  .pill.selected { animation: popIn .28s ease; }
  .anim-row { opacity: 0; animation: fadeInUp .4s ease forwards; }
  .spinner {
    width: 34px; height: 34px; border: 3px solid #e2e6ee; border-top-color: #f5871f;
    border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px;
  }
</style>
</head>
<body>

  <header>
    <a href="owner-dashboard.html" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="title">Add Expense</div>
  </header>

  <main>
    <label>CATEGORY</label>
    <div class="pill-row" id="categoryPills"></div>
    <input id="categoryOther" placeholder="Or type a category" style="margin-top:10px;">

    <div class="row-2">
      <div>
        <label>AMOUNT (₹)</label>
        <input id="expAmount" type="number" placeholder="Amount">
      </div>
      <div>
        <label>DATE</label>
        <input id="expDate" type="date">
      </div>
    </div>

    <label>NOTE</label>
    <textarea id="expNote" placeholder="e.g. October rent, dumbbell set, electricity bill"></textarea>

    <div class="error" id="formError"></div>

    <div class="section-title">RECENT EXPENSES</div>
    <div id="recentExpenses"><div class="empty-note">Loading...</div></div>
  </main>

  <div class="bottom-bar">
    <button class="primary" id="saveBtn">Save Expense</button>
  </div>

  <script type="module">
    import { watchAuthState } from "./js/auth-service.js?v=2";
    import { addExpense, getAllExpenses } from "./js/expense-service.js?v=2";

    const CATEGORIES = ["Rent", "Salaries", "Utilities", "Equipment", "Supplies", "Maintenance", "Marketing"];
    let selectedCategory = null;

    function renderCategoryPills() {
      const el = document.getElementById("categoryPills");
      el.innerHTML = "";
      CATEGORIES.forEach((c) => {
        const pill = document.createElement("div");
        pill.className = "pill" + (selectedCategory === c ? " selected" : "");
        pill.textContent = c;
        pill.addEventListener("click", () => {
          selectedCategory = c;
          document.getElementById("categoryOther").value = "";
          renderCategoryPills();
        });
        el.appendChild(pill);
      });
    }
    renderCategoryPills();

    document.getElementById("categoryOther").addEventListener("input", (e) => {
      if (e.target.value.trim()) {
        selectedCategory = null;
        renderCategoryPills();
      }
    });

    document.getElementById("expDate").value = new Date().toISOString().split("T")[0];

    function money(n) {
      return "₹" + Math.round(n || 0).toLocaleString("en-IN");
    }

    async function loadRecent() {
      const el = document.getElementById("recentExpenses");
      try {
        const expenses = await getAllExpenses();
        if (expenses.length === 0) {
          el.innerHTML = '<div class="empty-note">No expenses logged yet.</div>';
          return;
        }
        el.innerHTML = "";
        expenses.slice(0, 15).forEach((e, i) => {
          const d = e.date && e.date.toDate ? e.date.toDate() : null;
          const row = document.createElement("div");
          row.className = "exp-row anim-row";
          row.style.animationDelay = (i * 0.03) + "s";
          row.innerHTML = `
            <div>
              <div class="exp-cat">${e.category || "Uncategorized"}</div>
              ${e.note ? `<div class="exp-note">${e.note}</div>` : ""}
            </div>
            <div>
              <div class="exp-amount">${money(e.amount)}</div>
              <div class="exp-date">${d ? d.toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : ""}</div>
            </div>
          `;
          el.appendChild(row);
        });
      } catch (err) {
        el.innerHTML = '<div class="empty-note">Error loading expenses: ' + err.message + '</div>';
      }
    }

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const errorEl = document.getElementById("formError");
      const btn = document.getElementById("saveBtn");
      errorEl.style.display = "none";

      const category = selectedCategory || document.getElementById("categoryOther").value.trim();
      const amount = Number(document.getElementById("expAmount").value);
      const date = document.getElementById("expDate").value;
      const note = document.getElementById("expNote").value.trim();

      if (!category) {
        errorEl.textContent = "Please select or type a category.";
        errorEl.style.display = "block";
        return;
      }
      if (!amount || amount <= 0) {
        errorEl.textContent = "Please enter a valid amount.";
        errorEl.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Saving...";

      try {
        await addExpense({ category, amount, note, date });
        document.getElementById("expAmount").value = "";
        document.getElementById("expNote").value = "";
        document.getElementById("categoryOther").value = "";
        selectedCategory = null;
        renderCategoryPills();
        await loadRecent();
      } catch (err) {
        errorEl.textContent = "Error: " + err.message;
        errorEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Save Expense";
      }
    });

    watchAuthState((session) => {
      if (!session) { window.location.href = "owner-login.html"; return; }
      if (session.role !== "owner") {
        document.body.innerHTML = "<p style='padding:40px;text-align:center;'>Owner access only.</p>";
        return;
      }
      loadRecent();
    });
  </script>

</body>
</html>
