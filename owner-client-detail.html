<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTrack Owner — Client Detail</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7fa; font-family: 'Barlow', system-ui, sans-serif; color: #142850; }
  header { padding: 18px 24px 8px; display: flex; align-items: center; gap: 14px; }
  header a.back { color: #142850; display: flex; }
  .title { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 20px; }
  .client-summary { padding: 8px 24px 16px; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: #dbe4ff; display: flex;
    align-items: center; justify-content: center; font-family: 'Barlow Condensed'; font-weight: 700; font-size: 18px; }
  main { padding: 0 24px 30px; max-width: 480px; margin: 0 auto; }

  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; opacity:0; animation: fadeInUp .4s ease forwards; }
  .card:nth-of-type(1) { animation-delay: .05s; }
  .card:nth-of-type(2) { animation-delay: .12s; }
  .card:nth-of-type(3) { animation-delay: .19s; }
  .card:nth-of-type(4) { animation-delay: .26s; }
  .card:nth-of-type(5) { animation-delay: .33s; }
  .card-title { font-family: 'Barlow Condensed'; font-weight: 600; font-size: 14px; color: #6b7688; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; }
  .readonly-tag { font-size: 10px; color: #a9b3c2; font-weight: 500; }
  .kv-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 5px 0; }
  .kv-row span:first-child { color: #6b7688; }
  .body-text { font-size: 13px; color: #3a4658; line-height: 1.6; }
  .empty-note { font-size: 12.5px; color: #a9b3c2; font-style: italic; }
  .att-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f2f4f8; }
  .att-row:last-child { border-bottom: none; }
  .att-in { color: #2e9c5a; }
  .att-missed { color: #c1443c; }
  .loading { text-align: center; color: #6b7688; padding: 40px 0; }

  /* ===== fancy animations ===== */
  @keyframes fadeInUp { from { opacity:0; transform:translateY(14px);} to {opacity:1; transform:translateY(0);} }
  @keyframes popIn { 0% { transform:scale(.92); opacity:0;} 60% { transform:scale(1.03); opacity:1;} 100% { transform:scale(1); opacity:1;} }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulseGlow { 0%,100% { box-shadow:0 0 0 0 rgba(245,135,31,.5);} 50% { box-shadow:0 0 0 12px rgba(245,135,31,0);} }
  @keyframes logoPulse { 0%,100% { transform:scale(1);} 50% { transform:scale(1.06);} }
  body { animation: fadeInUp .4s ease both; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button, a.primary, button.primary, .role-btn, a.whatsapp, button.whatsapp, .pill, .option-card, .plan-card, .day-row, .toggle, .trainer-card {
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:active, a.primary:active, button.primary:active, .role-btn:active, a.whatsapp:active, button.whatsapp:active {
    transform: scale(.96);
  }
  .pill:active, .option-card:active, .plan-card:active, .trainer-card:active {
    transform: scale(.97);
  }
  .option-card.selected, .plan-card.selected, .pill.selected, .trainer-card.selected {
    animation: popIn .28s ease;
  }
  .anim-row { opacity: 0; animation: fadeInUp .4s ease forwards; }
  .spinner {
    width: 34px; height: 34px; border: 3px solid #e2e6ee; border-top-color: #f5871f;
    border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px;
  }
  .logo, .avatar:first-child { animation: popIn .5s ease; }

</style>
</head>
<body>

  <header>
    <a href="owner-dashboard.html" class="back" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="title" id="clientName">Loading...</div>
  </header>

  <div class="client-summary" id="clientSummary"></div>

  <main id="mainContent">
    <div class="loading"><div class="spinner"></div>Loading client details...</div>
  </main>

  <script type="module">
    import { watchAuthState } from "./js/auth-service.js?v=4";
    import { getClient, getPayments, getClientStatus } from "./js/client-service.js?v=4";
    import { getIntake, getLatestPlan, getRecentAttendance } from "./js/trainer-service.js?v=4";

    const params = new URLSearchParams(window.location.search);
    const clientId = params.get("clientId");
    const DAY_NAMES = { mon: "Mon", tue: "Tue", wed: "Wed", thu: "Thu", fri: "Fri", sat: "Sat", sun: "Sun" };

    function initials(name) {
      return name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
    }

    function fmtDate(ts) {
      if (!ts) return "—";
      return ts.toDate().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function fmtTime(ts) {
      if (!ts) return null;
      return ts.toDate().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
    }

    async function loadAndRender() {
      try {
        const client = await getClient(clientId);
        if (!client) {
          document.getElementById("mainContent").innerHTML = "<p style='padding:40px;text-align:center;'>Client not found.</p>";
          return;
        }

        document.getElementById("clientName").textContent = client.name;
        document.getElementById("clientSummary").innerHTML = `
          <div class="avatar">${initials(client.name)}</div>
          <div>
            <div style="font-size:12.5px;color:#6b7688;">${client.phone || ""} · ${client.purpose ? client.purpose.replace("_"," ") : ""}</div>
            <div style="font-size:12px;color:#6b7688;margin-top:2px;">${client.planName || ""}</div>
          </div>
        `;

        const [intake, plan, attendance, payments] = await Promise.all([
          getIntake(clientId),
          getLatestPlan(clientId),
          getRecentAttendance(clientId, 5),
          getPayments(clientId)
        ]);

        const { status, daysLeft } = getClientStatus(client);
        const statusText = status === "expired" ? "Expired" : status === "expiring" ? `${daysLeft} days left` : "Active";

        let html = "";

        // Membership card
        html += `
          <div class="card">
            <div class="card-title">MEMBERSHIP</div>
            <div class="kv-row"><span>Joined</span><span>${fmtDate(client.joiningDate)}</span></div>
            <div class="kv-row"><span>Expires</span><span>${fmtDate(client.expiryDate)}</span></div>
            <div class="kv-row"><span>Status</span><span>${statusText}</span></div>
          </div>
        `;

        // Payments card
        html += `<div class="card"><div class="card-title">PAYMENTS</div>`;
        if (payments.length === 0) {
          html += `<div class="empty-note">No payments logged yet.</div>`;
        } else {
          payments.forEach(p => {
            html += `<div class="kv-row"><span>${fmtDate(p.date)}</span><span>₹${p.amount.toLocaleString('en-IN')} (${p.method})</span></div>`;
          });
        }
        html += `</div>`;

        // Trainer intake notes card
        html += `<div class="card"><div class="card-title">TRAINER INTAKE NOTES <span class="readonly-tag">Read-only</span></div>`;
        if (!intake) {
          html += `<div class="empty-note">Trainer hasn't completed intake yet.</div>`;
        } else {
          html += `<div class="body-text">
            <strong>Fitness level:</strong> ${intake.fitnessLevel || "—"}<br>
            ${intake.heightCm ? `<strong>Height/Weight:</strong> ${intake.heightCm}cm / ${intake.weightKg || "—"}kg<br>` : ""}
            ${intake.target ? `<strong>Target:</strong> ${intake.target}<br>` : ""}
            ${intake.healthNotes ? `<strong>Health notes:</strong> ${intake.healthNotes}` : ""}
          </div>`;
        }
        html += `</div>`;

        // Workout plan card
        html += `<div class="card"><div class="card-title">WORKOUT PLAN <span class="readonly-tag">${plan && plan.sentAt ? 'Sent to client' : plan ? 'Not sent yet' : ''}</span></div>`;
        if (!plan) {
          html += `<div class="empty-note">No workout plan created yet.</div>`;
        } else {
          const lines = Object.keys(DAY_NAMES).map(k => `${DAY_NAMES[k]}: ${plan.days && plan.days[k] ? plan.days[k] : "Rest"}`).join(" · ");
          html += `<div class="body-text">${lines}</div>`;
          if (plan.notes) html += `<div class="body-text" style="margin-top:6px;color:#6b7688;">${plan.notes}</div>`;
        }
        html += `</div>`;

        // Attendance card
        html += `<div class="card"><div class="card-title">RECENT ATTENDANCE</div>`;
        if (attendance.length === 0) {
          html += `<div class="empty-note">No attendance recorded yet.</div>`;
        } else {
          attendance.forEach(a => {
            const inTime = fmtTime(a.checkInTime);
            const outTime = fmtTime(a.checkOutTime);
            const display = inTime ? `${inTime}${outTime ? ' – ' + outTime : ' (still in)'}` : `<span class="att-missed">Missed</span>`;
            html += `<div class="att-row"><span>${a.date}</span><span class="${inTime ? 'att-in' : ''}">${display}</span></div>`;
          });
        }
        html += `</div>`;

        document.getElementById("mainContent").innerHTML = html;
      } catch (err) {
        const linkified = err.message.replace(
          /(https?:\/\/[^\s]+)/g,
          '<a href="$1" target="_blank" style="color:#2b6fd1;text-decoration:underline;font-weight:600;word-break:break-all;">$1</a>'
        );
        document.getElementById("mainContent").innerHTML = `<p style='padding:40px 24px;text-align:center;color:#c1443c;'>Error: ${linkified}</p>`;
      }
    }

    watchAuthState((session) => {
      if (!session) { window.location.href = "owner-login.html"; return; }
      if (session.role !== "owner") {
        document.body.innerHTML = "<p style='padding:40px;text-align:center;'>Owner access only.</p>";
        return;
      }
      if (clientId) loadAndRender();
      else document.getElementById("mainContent").innerHTML = "<p style='padding:40px;text-align:center;'>No client selected.</p>";
    });
  </script>

</body>
</html>
