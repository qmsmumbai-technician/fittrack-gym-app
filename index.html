<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTrack Gym</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#142850">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #142850;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Barlow', system-ui, sans-serif; color: #fff; padding: 0 32px;
  }
  .logo { width: 72px; height: 72px; border-radius: 18px; background: #f5871f;
    display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  h1 { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 28px; margin: 0; }
  .sub { font-size: 13px; color: #9db0cf; margin-top: 4px; margin-bottom: 40px; }
  .role-btn { width: 100%; max-width: 340px; background: #fff; color: #142850; border: none;
    border-radius: 14px; padding: 18px 20px; font-family: 'Barlow'; font-weight: 600; font-size: 16px;
    margin-bottom: 14px; text-decoration: none; display: flex; align-items: center; gap: 14px; }
  .role-btn .icon-box { width: 40px; height: 40px; border-radius: 10px; background: #eef1f6;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .role-btn .arrow { margin-left: auto; color: #a9b3c2; }
</style>
</head>
<body>

  <div class="logo">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11v11h-11z"/><path d="M2 9.5h2M2 14.5h2M20 9.5h2M20 14.5h2"/></svg>
  </div>
  <h1>FitTrack Gym</h1>
  <div class="sub">Choose how you're signing in</div>

  <a class="role-btn" href="owner-login.html">
    <div class="icon-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#142850" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11v11h-11z"/><path d="M2 9.5h2M2 14.5h2M20 9.5h2M20 14.5h2"/></svg>
    </div>
    I'm the Gym Owner
    <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </a>

  <a class="role-btn" href="trainer-login.html">
    <div class="icon-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#142850" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
    </div>
    I'm a Trainer
    <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </a>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    }
  </script>

</body>
</html>
