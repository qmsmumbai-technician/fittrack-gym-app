<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitTrack Owner — Login</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#142850">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #f5f7fa;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Barlow', system-ui, sans-serif; color: #142850; padding: 0 32px;
  }
  .logo { width: 68px; height: 68px; border-radius: 18px; background: #142850;
    display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  h1 { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 24px; margin: 0; }
  .sub { font-size: 12.5px; color: #6b7688; margin-top: 2px; margin-bottom: 28px; }
  form { width: 100%; max-width: 340px; }
  label { font-size: 12.5px; font-weight: 600; color: #6b7688; display: block; margin-top: 14px; }
  input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 13px 14px;
    border-radius: 10px; border: 1.5px solid #dfe4ec; font-size: 15px; outline: none;
    font-family: 'Barlow'; }
  button { width: 100%; background: #f5871f; color: #fff; border: none; border-radius: 12px;
    padding: 16px; font-family: 'Barlow'; font-weight: 600; font-size: 15.5px; margin-top: 22px;
    cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .error { color: #c1443c; font-size: 13px; margin-top: 14px; text-align: center; display: none; }

  /* ===== fancy animations ===== */
  @keyframes fadeInUp { from { opacity:0; transform:translateY(14px);} to {opacity:1; transform:translateY(0);} }
  @keyframes popIn { 0% { transform:scale(.92); opacity:0;} 60% { transform:scale(1.03); opacity:1;} 100% { transform:scale(1); opacity:1;} }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulseGlow { 0%,100% { box-shadow:0 0 0 0 rgba(245,135,31,.5);} 50% { box-shadow:0 0 0 12px rgba(245,135,31,0);} }
  @keyframes logoPulse { 0%,100% { transform:scale(1);} 50% { transform:scale(1.06);} }
  body { animation: fadeInUp .4s ease; animation-fill-mode: none; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button, a.primary, button.primary, .role-btn, a.whatsapp, button.whatsapp, .pill, .option-card, .plan-card, .day-row, .toggle, .trainer-card {
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:active, a.primary:active, button.primary:active, .role-btn:active, a.whatsapp:active, button.whatsapp:active {
    transform: scale(.96);
  }
  .pill:active, .option-card:active, .plan-card:active, .trainer-card:active {
    transform: scale(.97);
  }
  .option-card.selected, .plan-card.selected, .pill.selected, .trainer-card.selected {
    animation: popIn .28s ease;
  }
  .anim-row { opacity: 0; animation: fadeInUp .4s ease forwards; }
  .spinner {
    width: 34px; height: 34px; border: 3px solid #e2e6ee; border-top-color: #f5871f;
    border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px;
  }
  .logo, .avatar:first-child { animation: popIn .5s ease; }

</style>
</head>
<body>

  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11v11h-11z"/><path d="M2 9.5h2M2 14.5h2M20 9.5h2M20 14.5h2"/></svg>
  </div>
  <h1>FitTrack Owner</h1>
  <div class="sub">Manage Clients, Trainers &amp; Revenue</div>

  <form id="loginForm">
    <label for="email">EMAIL</label>
    <input id="email" type="email" placeholder="you@email.com" required autocomplete="username">

    <label for="password">PASSWORD</label>
    <input id="password" type="password" placeholder="Enter password" required autocomplete="current-password">

    <button id="loginBtn" type="submit">Login</button>
    <div id="error" class="error"></div>
  </form>

  <script type="module">
    import { login, getCurrentRole } from "./js/auth-service.js?v=2";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    }

    const form = document.getElementById("loginForm");
    const btn = document.getElementById("loginBtn");
    const errorEl = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Logging in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const user = await login(email, password);
        const { role } = await getCurrentRole(user.uid);

        if (role === "owner") {
          window.location.href = "owner-dashboard.html";
        } else if (role === "trainer") {
          errorEl.textContent = "This account is registered as a Trainer, not an Owner.";
          errorEl.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Login";
        } else {
          errorEl.textContent = "This account has no role assigned. Contact the app admin.";
          errorEl.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Login";
        }
      } catch (err) {
        errorEl.textContent = "Error: " + err.code + " — " + err.message;
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });
  </script>

</body>
</html>
